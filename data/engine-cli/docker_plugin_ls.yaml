command: docker plugin ls
aliases: docker plugin ls, docker plugin list
short: 列出插件
long: |-
    列出当前已安装的所有插件。您可以使用 [`docker plugin install`](/reference/cli/docker/plugin/install/) 命令安装插件。
    也可以使用 `-f` 或 `--filter` 标志进行过滤。
    有关可用过滤选项的详细信息，请参考[过滤](#filter)部分。
usage: docker plugin ls [OPTIONS]
pname: docker plugin
plink: docker_plugin.yaml
options:
    - option: filter
      shorthand: f
      value_type: filter
      description: 提供过滤值（例如 `enabled=true`）
      details_url: '#filter'
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
    - option: format
      value_type: string
      description: |-
        使用自定义模板格式化输出：
        'table'：            以表格格式打印输出，带列标题（默认）
        'table TEMPLATE'：   使用给定的 Go 模板以表格格式打印输出
        'json'：             以 JSON 格式打印
        'TEMPLATE'：         使用给定的 Go 模板打印输出。
        有关使用模板格式化输出的更多信息，请参考 https://docs.docker.com/go/formatting/
      details_url: '#format'
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
    - option: no-trunc
      value_type: bool
      default_value: "false"
      description: 不截断输出
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
    - option: quiet
      shorthand: q
      value_type: bool
      default_value: "false"
      description: 仅显示插件 ID
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
inherited_options:
    - option: help
      value_type: bool
      default_value: "false"
      description: 打印用法
      deprecated: false
      hidden: true
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
examples: |-
    ```console
    $ docker plugin ls

    ID            NAME                                    DESCRIPTION                ENABLED
    69553ca1d123  tiborvass/sample-volume-plugin:latest   Docker 测试插件             true
    ```

    ### 过滤（--filter）{#filter}

    过滤标志（`-f` 或 `--filter`）的格式为 "key=value"。如果有多个过滤器，
    请传递多个标志（例如 `--filter "foo=bar" --filter "bif=baz"`）。

    当前支持的过滤器有：

    * enabled（布尔值 - true 或 false，0 或 1）
    * capability（字符串 - 当前支持 `volumedriver`、`networkdriver`、`ipamdriver`、`logdriver`、`metricscollector` 或 `authz`）

    #### enabled

    `enabled` 过滤器匹配已启用或禁用的插件。

    #### capability

    `capability` 过滤器匹配插件功能。一个插件可能有多个功能。
    当前支持的功能包括 `volumedriver`、`networkdriver`、`ipamdriver`、`logdriver`、`metricscollector` 和 `authz`。

    ```console
    $ docker plugin install --disable vieux/sshfs

    已安装插件 vieux/sshfs

    $ docker plugin ls --filter enabled=true

    ID                  NAME                DESCRIPTION         ENABLED
    ```

    ### 格式化输出（--format）{#format}

    格式化选项（`--format`）使用 Go 模板美化插件输出。

    Go 模板的有效占位符如下：

    | 占位符              | 描述                                      |
    |--------------------|------------------------------------------|
    | `.ID`              | 插件 ID                                   |
    | `.Name`            | 插件名称和标签                             |
    | `.Description`     | 插件描述                                  |
    | `.Enabled`         | 插件是否已启用                             |
    | `.PluginReference` | 用于从仓库推送/拉取的引用                   |

    使用 `--format` 选项时，`plugin ls` 命令将完全按照模板声明输出数据，
    或者在使用 `table` 指令时，还会包含列标题。

    以下示例使用无标题模板，并输出所有插件的 `ID` 和 `Name` 条目，用冒号（`:`）分隔：

    ```console
    $ docker plugin ls --format "{{.ID}}: {{.Name}}"

    4be01827a72e: vieux/sshfs:latest
    ```

    要以 JSON 格式列出所有插件，请使用 `json` 指令：
    ```console
    $ docker plugin ls --format json
    {"Description":"Docker 的 sshFS 插件","Enabled":false,"ID":"856d89febb1c","Name":"vieux/sshfs:latest","PluginReference":"docker.io/vieux/sshfs:latest"}
    ```
