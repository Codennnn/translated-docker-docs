command: docker plugin push
short: 将插件推送到仓库
long: |-
    在使用 `docker plugin create` 创建插件并准备好分发后，或者如果您从其他来源获取了插件，
    请使用 `docker plugin push` 命令将插件共享到 Docker 仓库。

    有关注册表凭据的管理，请参阅 [docker login](/reference/cli/docker/login/)。
usage: docker plugin push [OPTIONS] PLUGIN[:TAG]
pname: docker plugin
plink: docker_plugin.yaml
options:
    - option: disable-content-trust
      value_type: bool
      default_value: "true"
      description: 跳过镜像验证
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
inherited_options:
    - option: help
      value_type: bool
      default_value: "false"
      description: 打印用法
      deprecated: false
      hidden: true
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
examples: |-
    The following example shows how to push a sample `user/plugin`.

    ```console
    $ docker plugin ls

    ID             NAME                    DESCRIPTION                  ENABLED
    69553ca1d456   user/plugin:latest      A sample plugin for Docker   false

    $ docker plugin push user/plugin
    ```
deprecated: false
hidden: false
min_api_version: "1.25"
experimental: false
experimentalcli: false
kubernetes: false
swarm: false

