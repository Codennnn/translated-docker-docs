base image: |
  基础镜像是您在 Dockerfile 中通过 `FROM` 指令指定的镜像。
  它定义了构建过程的起点。
  Dockerfile 中的指令会在基础镜像之上创建额外的层。
  使用 `FROM scratch` 指令的 Dockerfile 会采用空的基础镜像。

build: |
  构建是使用 Dockerfile 创建 Docker 镜像的过程。构建过程需要 Dockerfile 和一个"上下文"。
  上下文指的是构建镜像时所在目录中的文件集合。

container: |
  容器是镜像的可运行实例。您可以使用 Docker CLI 或 API 来启动、停止、移动或删除容器。
  容器之间相互隔离，也与主机系统隔离，但共享操作系统内核。
  它们提供了一种轻量级且一致的应用程序运行方式。

context: |
  Docker 上下文包含了 Docker CLI 连接不同 Docker 环境（如远程 Docker 主机或 Docker Desktop）
  所需的端点配置。使用 `docker context use` 命令可以在不同上下文之间切换。

Docker CLI: |
  Docker CLI 是与 Docker 引擎交互的命令行界面。它提供了 `docker run`、`docker build`、
  `docker ps` 等命令来管理 Docker 容器、镜像和服务。

Docker Compose: |
  Docker Compose 是一个通过 YAML 文件（`compose.yaml`）定义和运行多容器 Docker 应用程序的工具。
  只需一条命令，即可启动配置中定义的所有服务。

Docker Desktop: |
  Docker Desktop 是一款易于安装的应用程序，适用于 Windows、macOS 和 Linux，
  提供本地 Docker 开发环境。它包含 Docker 引擎、Docker CLI、Docker Compose 和 Kubernetes 集群。

Docker Engine: |
  Docker 引擎是创建和运行 Docker 容器的客户端-服务器技术。它包括 Docker 守护进程（`dockerd`）、
  REST API 和 Docker CLI 客户端。

Docker Hub: |
  Docker Hub 是 Docker 的公共仓库服务，用户可以在其中存储、共享和管理容器镜像。
  它托管 Docker 官方镜像、已验证发布者内容以及社区贡献的镜像。

image: |
  镜像是用于创建容器的只读模板。它通常包含基础操作系统和使用 Dockerfile 打包在一起的应用程序代码。
  镜像使用标签进行版本管理，可以推送到容器仓库（如 Docker Hub）或从其中拉取。

layer: |
  在镜像中，层是 Dockerfile 中指令所表示的修改。层按顺序应用于基础镜像以创建最终镜像。
  未更改的层会被缓存，使镜像构建更快、更高效。

multi-architecture image: |
  多架构镜像是支持多种 CPU 架构（如 `amd64` 或 `arm64`）的 Docker 镜像。
  使用多架构镜像时，Docker 会自动为您的平台拉取正确架构的镜像。

persistent storage: |
  持久化存储或卷存储为容器提供了一种在生命周期之外保留数据的方法。
  这种存储可以存在于主机或外部存储系统上，不与容器的运行时绑定。

registry: |
  仓库是 Docker 镜像的存储和内容分发系统。默认的公共仓库是 Docker Hub，
  但您也可以使用 Docker Distribution 设置私有仓库。

volume: |
  卷是容器内绕过联合文件系统的特殊目录。卷的设计目的是在容器生命周期之外独立持久化数据。
  Docker 支持主机卷、匿名卷和命名卷。