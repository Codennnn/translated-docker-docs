command: docker buildx history trace
short: 查看构建的 OpenTelemetry 追踪
long: |
  打开指定构建记录的 OpenTelemetry 追踪，并通过 Jaeger UI 进行可视化分析。

  如果未指定构建记录（REF），则默认使用最近一条记录。

  该命令会启动 Jaeger 容器，并自动在浏览器中打开追踪页面，方便你深入分析构建性能瓶颈。
usage: docker buildx history trace [OPTIONS] [REF]
pname: docker buildx history
plink: docker_buildx_history.yaml
options:
    - option: addr
      value_type: string
      default_value: auto
      description: Jaeger 监听地址
      details: |
        自定义 Jaeger 容器的监听地址，格式为 `<主机>:<端口>`。

        默认值为 `auto`，系统会自动分配可用端口。
    - option: compare
      value_type: string
      description: 对比两次构建的追踪
      details: |
        同时打开两条构建记录的追踪页面，方便并排对比性能差异。

        例如：
        ```console
        $ docker buildx history trace --compare r0,r1
        ```
    - option: builder
      value_type: string
      description: 覆盖构建器实例
      details: |
        指定要使用的构建器。支持以下格式：

        - 构建器名称（如 `mybuilder`）
        - Docker 上下文（如 `default`）
        - 远端地址（如 `tcp://localhost:8376` 或 `ssh://user@host`）
        - 本地容器（如 `docker-container://mybuilder`）
        - 本地进程（如 `docker://proc-1234`）

        默认使用当前构建器。
    - option: debug
      value_type: bool
      default_value: "false"
      description: 启用调试模式
      details: |
        输出详细的调试日志，帮助排查构建器通信或追踪数据问题。
examples: |
  ### 查看最近一条构建的追踪信息

  ```console
  $ docker buildx history trace
  ```

  ### 打开指定构建记录的追踪

  ```console
  $ docker buildx history trace proud_matsumoto
  ```

  ### 指定 Jaeger 监听端口

  ```console
  $ docker buildx history trace --addr :8080 quirky_allen
  ```

  ### 对比两次构建的追踪差异

  ```console
  $ docker buildx history trace --compare r0,r1
  ```

  浏览器将并排打开两次构建的追踪页面，方便对比分析性能差异。

