command: docker buildx history import
short: 将构建记录导入 Docker Desktop
long: |-
    从 `.dockerbuild` 归档文件中导入构建记录到 Docker Desktop，
    方便你查看、检查并分析在其他环境或 CI 流水线中生成的构建结果。
usage: docker buildx history import [OPTIONS] -
pname: docker buildx history
plink: docker_buildx_history.yaml
options:
    - option: file
      shorthand: f
      value_type: stringArray
      default_value: '[]'
      description: 从指定文件路径导入
      details_url: '#file'
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
inherited_options:
    - option: builder
      value_type: string
      description: 覆盖已配置的构建器实例
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
    - option: debug
      shorthand: D
      value_type: bool
      default_value: "false"
      description: 开启调试日志
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
examples: |-
    ### 从标准输入导入 `.dockerbuild` 归档

    ```console
    docker buildx history import < mybuild.dockerbuild
    ```

    ### 从文件导入构建归档（--file）{#file}

    ```console
    docker buildx history import --file ./artifacts/backend-build.dockerbuild
    ```

    ### 手动打开构建

    默认情况下，`import` 命令会自动在 Docker Desktop 中打开已导入的构建。
    只有在需要重新打开特定构建时，才需手动执行 `open` 命令。

    若已导入多个构建，可手动打开其中一个：

    ```console
    docker buildx history open ci-build
    ```
deprecated: false
hidden: false
experimental: false
experimentalcli: false
