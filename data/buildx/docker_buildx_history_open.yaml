command: docker buildx history open
short: 在 Docker Desktop 中打开构建记录
long: |-
    在 Docker Desktop 中可视化查看某次构建的详细记录。
    使用该命令前，请确保本地已安装并运行 Docker Desktop。
usage: docker buildx history open [OPTIONS] [REF]
pname: docker buildx history
plink: docker_buildx_history.yaml
inherited_options:
    - option: builder
      value_type: string
      description: 手动指定要使用的构建器实例
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
    - option: debug
      shorthand: D
      value_type: bool
      default_value: "false"
      description: 开启调试日志
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
examples: |-
    ### 打开最近一次构建

    ```console
    docker buildx history open
    ```
    默认展示当前构建器最新一条记录。

    ### 打开指定构建

    ```console
    # 使用构建 ID
    docker buildx history open qu2gsuo8ejqrwdfii23xkkckt

    # 或使用相对偏移
    docker buildx history open ^1
    ```
