command: docker buildx history logs
short: 打印构建日志
long: |-
    输出已完成构建的完整日志，格式与 `--progress=plain` 一致，逐步展示详细过程。

    默认显示当前构建器上最新一次构建的日志。

    也可通过偏移量查看更早的构建：

    - `^1`：倒数第二次构建
    - `^2`：倒数第三次构建
usage: docker buildx history logs [OPTIONS] [REF]
pname: docker buildx history
plink: docker_buildx_history.yaml
options:
    - option: progress
      value_type: string
      default_value: plain
      description: 设置进度输出类型（plain、rawjson、tty）
      details_url: '#progress'
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
inherited_options:
    - option: builder
      value_type: string
      description: 覆盖已配置的构建器实例
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
    - option: debug
      shorthand: D
      value_type: bool
      default_value: "false"
      description: 开启调试日志
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
examples: |-
    ### 查看最新一次构建的日志

    ```console
    $ docker buildx history logs
    #1 [internal] load build definition from Dockerfile
    #1 transferring dockerfile: 31B done
    #1 DONE 0.0s
    #2 [internal] load .dockerignore
    #2 transferring context: 2B done
    #2 DONE 0.0s
    ...
    ```

    默认显示当前构建器上最新一次构建的完整日志。

    ### 查看指定构建的日志

    可通过构建 ID 或偏移量指定：

    ```console
    # 使用构建 ID
    docker buildx history logs qu2gsuo8ejqrwdfii23xkkckt

    # 或使用相对偏移
    docker buildx history logs ^1
    ```

    ### 设置进度输出类型（--progress）{#progress}

    ```console
    $ docker buildx history logs ^1 --progress rawjson
    {"id":"buildx_step_1","status":"START","timestamp":"2024-05-01T12:34:56.789Z","detail":"[internal] load build definition from Dockerfile"}
    {"id":"buildx_step_1","status":"COMPLETE","timestamp":"2024-05-01T12:34:57.001Z","duration":212000000}
    ...
    ```
deprecated: false
hidden: false
experimental: false
experimentalcli: false
kubernetes: false
swarm: false

