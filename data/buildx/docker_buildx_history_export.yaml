command: docker buildx history export
short: 将构建记录导出为 Docker Desktop 包
long: |-
    将一个或多个构建记录导出为 `.dockerbuild` 归档文件。这些归档文件
    包含元数据、日志和构建输出，可以导入到 Docker Desktop 中
    或在跨环境之间共享。
usage: docker buildx history export [OPTIONS] [REF...]
pname: docker buildx history
plink: docker_buildx_history.yaml
options:
    - option: all
      value_type: bool
      default_value: "false"
      description: 导出构建器的所有构建记录
      details_url: '#all'
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
    - option: finalize
      value_type: bool
      default_value: "false"
      description: 确保在导出前构建记录已完成最终化
      details_url: '#finalize'
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
    - option: output
      shorthand: o
      value_type: string
      description: 输出文件路径
      details_url: '#output'
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
inherited_options:
    - option: builder
      value_type: string
      description: 覆盖已配置的构建器实例
      details_url: '#builder'
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
    - option: debug
      shorthand: D
      value_type: bool
      default_value: "false"
      description: 启用调试日志记录
      details_url: '#debug'
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
examples: |-
    ### 将所有构建记录导出到文件 (--all) {#all}

    使用 `--all` 标志并重定向输出：

    ```console
    docker buildx history export --all > all-builds.dockerbuild
    ```

    或使用 `--output` 标志：

    ```console
    docker buildx history export --all -o all-builds.dockerbuild
    ```

    ### 使用特定的构建器实例 (--builder) {#builder}

    ```console
    docker buildx history export --builder builder0 ^1 -o builder0-build.dockerbuild
    ```

    ### 启用调试日志记录 (--debug) {#debug}

    ```console
    docker buildx history export --debug qu2gsuo8ejqrwdfii23xkkckt -o debug-build.dockerbuild
    ```

    ### 确保在导出前构建记录已完成最终化 (--finalize) {#finalize}

    客户端可以并发报告自己的跟踪信息，在导出时可能并非所有跟踪信息
    都已保存。使用 `--finalize` 标志可确保所有跟踪信息在导出前
    已完成最终化。

    ```console
    docker buildx history export --finalize qu2gsuo8ejqrwdfii23xkkckt -o finalized-build.dockerbuild
    ```

    ### 将单个构建导出到自定义文件 (--output) {#output}

    ```console
    docker buildx history export qu2gsuo8ejqrwdfii23xkkckt --output mybuild.dockerbuild
    ```

    您可以通过运行以下命令查找构建 ID：

    ```console
    docker buildx history ls
    ```

    将两个构建导出到单独的文件：

    ```console
    # 使用构建 ID
    docker buildx history export qu2gsuo8ejqrwdfii23xkkckt qsiifiuf1ad9pa9qvppc0z1l3 -o multi.dockerbuild

    # 或使用相对偏移量
    docker buildx history export ^1 ^2 -o multi.dockerbuild
    ```

    或使用 shell 重定向：

    ```console
    docker buildx history export ^1 > mybuild.dockerbuild
    docker buildx history export ^2 > backend-build.dockerbuild
    ```
deprecated: false
hidden: false
experimental: false
