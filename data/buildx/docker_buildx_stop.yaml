command: docker buildx stop
short: 停止构建器实例
long: |-
    停止指定的或当前的构建器。此操作不会阻止 buildx build 命令重新启动构建器。具体的停止实现取决于驱动程序。
usage: docker buildx stop [NAME]
pname: docker buildx
plink: docker_buildx.yaml
inherited_options:
    - option: builder
      value_type: string
      description: 覆盖已配置的构建器实例
      details_url: '#builder'
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
    - option: debug
      shorthand: D
      value_type: bool
      default_value: "false"
      description: 启用调试日志记录
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
examples: |-
