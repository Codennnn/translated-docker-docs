command: docker buildx history ls
short: 列出构建记录
long: |-
    列出当前构建器已保存的完成记录，每条包含构建 ID、名称、状态、时间戳与耗时。

    默认仅展示当前构建器的记录，可通过参数筛选结果。
usage: docker buildx history ls [OPTIONS]
pname: docker buildx history
plink: docker_buildx_history.yaml
options:
    - option: filter
      value_type: stringArray
      default_value: '[]'
      description: 设置筛选条件（如 `status=error`）
      details_url: '#filter'
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
    - option: format
      value_type: string
      default_value: table
      description: 指定输出格式
      details_url: '#format'
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
    - option: local
      value_type: bool
      default_value: "false"
      description: 仅列出当前仓库的记录
      details_url: '#local'
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
    - option: no-trunc
      value_type: bool
      default_value: "false"
      description: 不截断输出内容
      details_url: '#no-trunc'
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
inherited_options:
    - option: builder
      value_type: string
      description: 覆盖已配置的构建器实例
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
    - option: debug
      shorthand: D
      value_type: bool
      default_value: "false"
      description: 开启调试日志
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
examples: |-
    ### 列出当前构建器的全部记录

    ```console
    $ docker buildx history ls
    BUILD ID                    NAME           STATUS     CREATED AT        DURATION
    qu2gsuo8ejqrwdfii23xkkckt   .dev/2850      Completed  3 days ago        1.4s
    qsiifiuf1ad9pa9qvppc0z1l3   .dev/2850      Completed  3 days ago        1.3s
    g9808bwrjrlkbhdamxklx660b   .dev/3120      Completed  5 days ago        2.1s
    ```

    ### 筛选失败构建（--filter）{#filter}

    ```console
    docker buildx history ls --filter status=error
    ```

    支持以下筛选字段与比较符：

    | 字段                                   | 支持的比较符                                     | 示例                       |
    |:---------------------------------------|:-------------------------------------------------|:---------------------------|
    | `ref`、`repository`、`status`          | `=`、`!=`                                       | `--filter status!=success` |
    | `startedAt`、`completedAt`、`duration` | `<`、`>`（时间值）                              | `--filter duration>30s`    |

    可重复使用 `--filter` 组合多条件：

    ```console
    docker buildx history ls --filter status=error --filter duration>30s
    ```

    ### 仅展示当前仓库记录（--local）{#local}

    ```console
    docker buildx history ls --local
    ```

    ### 完整输出不截断（--no-trunc）{#no-trunc}

    ```console
    docker buildx history ls --no-trunc
    ```

    ### 自定义输出格式（--format）{#format}

    #### JSON 输出

    ```console
    $ docker buildx history ls --format json
    [
      {
        "ID": "qu2gsuo8ejqrwdfii23xkkckt",
        "Name": ".dev/2850",
        "Status": "Completed",
        "CreatedAt": "2025-04-15T12:33:00Z",
        "Duration": "1.4s"
      },
      {
        "ID": "qsiifiuf1ad9pa9qvppc0z1l3",
        "Name": ".dev/2850",
        "Status": "Completed",
        "CreatedAt": "2025-04-15T12:29:00Z",
        "Duration": "1.3s"
      }
    ]
    ```

    #### Go 模板输出

    ```console
    $ docker buildx history ls --format '{{.Name}} - {{.Duration}}'
    .dev/2850 - 1.4s
    .dev/2850 - 1.3s
    .dev/3120 - 2.1s
    ```
