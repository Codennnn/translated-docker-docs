command: docker buildx rm
short: 移除一个或多个构建器实例
long: |-
    移除指定的或当前的构建器。尝试移除默认构建器时不会产生任何操作。
usage: docker buildx rm [OPTIONS] [NAME...]
pname: docker buildx
plink: docker_buildx.yaml
options:
    - option: all-inactive
      value_type: bool
      default_value: "false"
      description: 移除所有非活动构建器
      details_url: '#all-inactive'
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
    - option: force
      shorthand: f
      value_type: bool
      default_value: "false"
      description: 不提示确认
      details_url: '#force'
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
    - option: keep-daemon
      value_type: bool
      default_value: "false"
      description: 保持 BuildKit 守护进程运行
      details_url: '#keep-daemon'
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
    - option: keep-state
      value_type: bool
      default_value: "false"
      description: 保持 BuildKit 状态
      details_url: '#keep-state'
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
inherited_options:
    - option: builder
      value_type: string
      description: 覆盖已配置的构建器实例
      details_url: '#builder'
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
    - option: debug
      shorthand: D
      value_type: bool
      default_value: "false"
      description: 启用调试日志记录
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
examples: |-
    ### 移除所有非活动构建器（--all-inactive）{#all-inactive}

    移除未在运行状态的构建器。

    ```console
    $ docker buildx rm --all-inactive
    警告！这将移除所有未在运行状态的构建器。您确定要继续吗？ [y/N] y
    ```

    ### 覆盖已配置的构建器实例（--builder）{#builder}

    与 [`buildx --builder`](/reference/cli/docker/buildx/#builder) 相同。

    ### 不提示确认（--force）{#force}

    在移除非活动构建器之前不提示确认。

    ```console
    $ docker buildx rm --all-inactive --force
    ```

    ### 保持 BuildKit 守护进程运行（--keep-daemon）{#keep-daemon}

    在移除 buildx 上下文后保持 BuildKit 守护进程运行。这在您独立管理
    BuildKit 守护进程和 buildx 上下文时很有用。仅受
    [`docker-container`](/build/drivers/docker-container/)
    和 [`kubernetes`](/build/drivers/kubernetes/) 驱动程序支持。

    ### 保持 BuildKit 状态（--keep-state）{#keep-state}

    保持 BuildKit 状态，以便具有相同名称的新构建器可以重用它。
    目前仅受 [`docker-container` 驱动程序](/build/drivers/docker-container/) 支持。
deprecated: false
hidden: false
experimental: false
experimentalcli: false
kubernetes: false
swarm: false

