examples: |-
    ### 包含内部/前端镜像（--all）{#all}

    `--all` 标志允许清除使用 `#syntax=` 指令或 `BUILDKIT_SYNTAX` 构建参数设置的
    内部辅助镜像和前端镜像。

    ### 提供过滤值（--filter）{#filter}

    您可以使用 `--filter` 标志精细控制要删除的缓存记录。

    过滤器格式为 `<key><op><value>`，称为选择器。所有选择器都必须匹配目标对象，
    过滤器才为真。我们定义运算符 `=` 表示相等，`!=` 表示不相等，`~=` 表示正则表达式。

    有效的过滤键包括：
    - `until` 标志用于保留在最近时间段内使用过的记录。
      值为持续时间字符串，例如 `24h` 或 `2h30m`，允许的单位为 `(h)小时`、`(m)分钟` 和 `(s)秒`。\n    - `id` 标志用于定位特定的镜像 ID。
    - `parents` 标志用于定位指定镜像 ID 的父记录。多个父 ID 用分号（`;`）分隔。
    - `description` 标志用于定位描述为指定子字符串的记录。
    - `inuse` 标志用于定位正在积极使用且因此不可回收的记录。
    - `mutable` 标志用于定位可变的记录。
    - `immutable` 标志用于定位不可变的记录。
    - `shared` 标志用于定位与其他资源（通常是镜像）共享的记录。
    - `private` 标志用于定位不共享的记录。
    - `type` 标志用于按类型定位记录。有效类型包括：
      - `internal`
      - `frontend`
      - `source.local`
      - `source.git.checkout`
      - `exec.cachemount`
      - `regular`

    示例：

    ```console
    docker buildx prune --filter "until=24h"
    docker buildx prune --filter "description~=golang"
    docker buildx prune --filter "parents=dpetmoi6n0yqanxjqrbnofz9n;kgoj0q6g57i35gdyrv546alz7"
    docker buildx prune --filter "type=source.local"
    docker buildx prune --filter "type!=exec.cachemount"
    ```

    > [!NOTE]
    > 多个 `--filter` 标志通过 AND 运算组合在一起。

    ### 允许为缓存保留的最大磁盘空间量（--max-used-space）{#max-used-space}

    `--max-used-space` 标志允许设置构建缓存可以使用的最大磁盘空间量。
    如果缓存使用的磁盘空间超过此值，将删除最近最少使用的缓存记录，
    直到总使用空间小于或等于指定值。

    值以字节为单位指定。您可以使用人类可读的内存字符串，
    例如 `128mb`、`2gb` 等。单位不区分大小写。

    ### 清理后目标空闲磁盘空间量（--min-free-space）{#min-free-space}

    `--min-free-space` 标志允许设置清理后应可用的目标空闲磁盘空间量。
    如果可用磁盘空间小于此值，将删除最近最少使用的缓存记录，
    直到可用空闲空间大于或等于指定值。

    值以字节为单位指定。您可以使用人类可读的内存字符串，
    例如 `128mb`、`2gb` 等。单位不区分大小写。

    ### 始终允许为缓存保留的磁盘空间量（--reserved-space）{#reserved-space}

    `--reserved-space` 标志允许设置应始终为构建缓存保留的磁盘空间量。
    如果可用磁盘空间小于此值，将删除最近最少使用的缓存记录，
    直到可用空闲空间大于或等于指定值。

    值以字节为单位指定。您可以使用人类可读的内存字符串，
    例如 `128mb`、`2gb` 等。单位不区分大小写。

    ### 覆盖已配置的构建器实例（--builder）{#builder}

    与 [`buildx --builder`](/reference/cli/docker/buildx/#builder) 相同。
