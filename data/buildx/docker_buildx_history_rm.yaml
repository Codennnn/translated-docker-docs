command: docker buildx history rm
short: 删除构建记录
long: |-
    从当前构建器的历史记录中移除一条或多条构建。
    支持按构建 ID、相对偏移删除，也可使用 `--all` 一次性清空。
usage: docker buildx history rm [OPTIONS] [REF...]
pname: docker buildx history
plink: docker_buildx_history.yaml
options:
    - option: all
      value_type: bool
      default_value: "false"
      description: 删除全部构建记录
      details_url: '#all'
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
inherited_options:
    - option: builder
      value_type: string
      description: 手动指定要使用的构建器实例
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
    - option: debug
      shorthand: D
      value_type: bool
      default_value: "false"
      description: 开启调试日志
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
examples: |-
    ### 删除单条构建

    ```console
    # 使用构建 ID
    docker buildx history rm qu2gsuo8ejqrwdfii23xkkckt

    # 或使用相对偏移
    docker buildx history rm ^1
    ```

    ### 批量删除

    ```console
    # 使用构建 ID
    docker buildx history rm qu2gsuo8ejqrwdfii23xkkckt qsiifiuf1ad9pa9qvppc0z1l3

    # 或使用相对偏移
    docker buildx history rm ^1 ^2
    ```

    ### 清空当前构建器全部记录 (--all) {#all}

    ```console
    docker buildx history rm --all
    ```
