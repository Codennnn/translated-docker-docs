command: docker buildx use
short: 设置当前构建器实例
long: |-
    切换当前构建器实例。执行此命令后，后续的构建命令将在指定的构建器上运行。也可以使用上下文名称切换到该上下文的默认构建器。
usage: docker buildx use [OPTIONS] NAME
pname: docker buildx
plink: docker_buildx.yaml
options:
    - option: default
      value_type: bool
      default_value: "false"
      description: 将构建器设置为当前上下文的默认值
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
    - option: global
      value_type: bool
      default_value: "false"
      description: 构建器持久化上下文变更
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
inherited_options:
    - option: builder
      value_type: string
      description: 覆盖已配置的构建器实例
      details_url: '#builder'
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
    - option: debug
      shorthand: D
      value_type: bool
      default_value: "false"
      description: 启用调试日志记录
      deprecated: false
      hidden: false
      experimental: false
      experimentalcli: false
      kubernetes: false
      swarm: false
examples: |-
    ### 覆盖已配置的构建器实例 (--builder) {#builder}

    与 [`buildx --builder`](/reference/cli/docker/buildx/#builder) 相同。
deprecated: false
hidden: false
experimental: false
experimentalcli: false
kubernetes: false
swarm: false

